<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>KindleFill</title>
<style>
  :root {
    color-scheme: light dark;

    --surface: #ffffff;   /* the window's content plane */
    --well: #f4f5f7;      /* recessed: inputs, the log, callouts */
    --ink: #16171a;
    --muted: #5c626b;     /* 6.4:1 on surface, 6.1:1 on well — passes on both */
    --line: #dfe1e5;
    --line-strong: #c8ccd2;

    /* Solid-fill colours carry their own foreground. A single --accent used as both
       text and button background is how the dark theme ended up with white-on-#6a9bff
       at 2.3:1 — legible in the designer's light theme, not in the shipped one. */
    /* #2f6feb cleared white text by 0.07 — passing, but one theme tweak from not.
       #2a63d8 carries 5.3:1 and leaves room to move. */
    --accent: #2a63d8; --accent-on: #ffffff; --accent-hover: #2455bd;
    --ok: #1a7f4b;
    --bad: #b3261e; --bad-on: #ffffff; --bad-hover: #9a1f18;

    /* Caution surface. Text is a dark shade of the surface's own hue rather than a
       neutral grey, which always looks washed out on a tint. */
    --warn-surface: #fdf6ea; --warn-line: #e6d3ad; --warn-ink: #6b4400;

    --focus: rgba(42, 99, 216, .4);

    --r-sm: 6px; --r-md: 8px;
    --dur: 160ms; --ease: cubic-bezier(.22, .61, .36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1d1f23;
      --well: #16171a;
      --ink: #e8eaed;
      --muted: #a0a6ae;
      --line: #32353b;
      --line-strong: #43474e;

      --accent: #6a9bff; --accent-on: #0c1120; --accent-hover: #82adff;
      --ok: #4ec98a;
      --bad: #ff7a72; --bad-on: #2a0a08; --bad-hover: #ff9a94;

      --warn-surface: #262015; --warn-line: #4b3f26; --warn-ink: #f2cd92;

      --focus: rgba(106, 155, 255, .5);
    }
  }
  * { box-sizing: border-box; }
  /* Motion here only ever confirms a state change, so removing it costs nothing. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; }
  }
  /* The window never scrolls. Everything above the log is fixed-height, so the log
     takes the remainder — which keeps the layout exact at the default size and
     still correct when the window is resized or a warning appears and pushes
     everything down. A fixed log height can only be right at one window size, and it
     wasn't right at this one.

     `overflow-y: auto` rather than `hidden`: normally the log soaks up the slack and
     no scrollbar appears at all, but when the conflict and firmware banners are both
     showing there is genuinely more content than fits, and scrolling to it beats
     silently clipping it. */
  html, body { height: 100%; }
  /* One continuous content plane divided by hairlines, rather than three bordered
     cards on a page background. Two reasons: the window's own titlebar already frames
     the app, so a second and third frame inside it is decoration; and the callouts
     below genuinely need to be boxes — leaving them the only boxes on screen is what
     makes them read as exceptional rather than as more of the same. */
  body {
    margin: 0; background: var(--surface); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .block { padding: 16px 20px; border-bottom: 1px solid var(--line); flex: none; }
  .block:last-child { border-bottom: none; }
  /* `min-height: 0` is load-bearing: without it a flex item refuses to shrink below
     its content, and the log's own scroll area would push the page tall again. */
  .block.grow { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  /* The titlebar already says KindleFill; repeating it costs 40px and says nothing. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .row .k { color: var(--muted); }
  .row .v { font-variant-numeric: tabular-nums; }
  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 500; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  label { color: var(--muted); display: block; margin-bottom: 4px; }
  .targets { display: flex; gap: 10px; align-items: flex-end; }
  .targets > div { flex: 1; }
  input[type=number], input[type=text] {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong);
    border-radius: var(--r-md); background: var(--well); color: var(--ink);
    font: inherit; font-variant-numeric: tabular-nums;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  input[type=number]:focus, input[type=text]:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus);
  }
  input:disabled { opacity: .55; cursor: default; }
  input[type=checkbox] { accent-color: var(--accent); }
  .ack { display: flex; align-items: flex-start; gap: 7px; margin: 8px 0 0; color: inherit; }
  .ack input { margin: 3px 0 0; flex: none; }
  /* A recessed well, not a nested card: no shadow, a surface *darker* than the plane
     it sits on, so it reads as inset. Each one keeps its own action inside it —
     a destructive button in the row below would be separated from the only thing on
     screen that says what it deletes. */
  .callout {
    background: var(--well); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 11px 13px; margin-top: 12px;
  }
  .callout--warn {
    background: var(--warn-surface); border-color: var(--warn-line); color: var(--warn-ink);
  }
  .callout > :first-child { margin-top: 0; }
  .callout .buttons { margin-top: 10px; }
  .names {
    margin: 6px 0 0; padding-left: 18px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  }
  .names li + li { margin-top: 2px; }
  .buttons { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    padding: 7px 13px; border-radius: var(--r-md); border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink); font: inherit; font-weight: 500;
    cursor: pointer;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                color var(--dur) var(--ease);
  }
  button:hover:not(:disabled) { background: var(--well); border-color: var(--muted); }
  button:active:not(:disabled) { background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
  button.primary:hover:not(:disabled),
  button.primary:active:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.danger { background: var(--bad); border-color: var(--bad); color: var(--bad-on); }
  button.danger:hover:not(:disabled),
  button.danger:active:not(:disabled) { background: var(--bad-hover); border-color: var(--bad-hover); }
  .bar {
    height: 8px; background: var(--well); border: 1px solid var(--line);
    border-radius: 999px; overflow: hidden; margin: 2px 0 10px;
  }
  .bar > i {
    display: block; height: 100%; width: 0; background: var(--accent);
    border-radius: inherit; transition: width var(--dur) var(--ease);
  }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  /* During a fill this is the primary reading on screen, so it gets ink, not grey. */
  #p-left { font-weight: 500; }
  #p-right { color: var(--muted); }
  #log {
    flex: 1 1 auto; min-height: 60px; margin-top: 10px;
    overflow-y: auto; background: var(--well); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 9px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  /* Teaches what the empty box is for rather than sitting there blank. */
  #log:empty::before { content: "Activity from the device appears here."; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .note.strong { color: var(--ink); }
  .callout--warn .note { color: inherit; }
  .note.warn { color: var(--warn-ink); }
  @media (prefers-color-scheme: dark) { .note.warn { color: var(--warn-ink); } }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1 class="sr-only">KindleFill</h1>

  <section class="block">
    <div class="status"><span class="dot" id="dot"></span><span id="devline">Looking for a Kindle…</span></div>
    <div id="devinfo" class="hidden">
      <div class="row"><span class="k">Storage</span><span class="v" id="d-storage">—</span></div>
      <div class="row"><span class="k">Capacity</span><span class="v" id="d-total">—</span></div>
      <div class="row"><span class="k">Free now</span><span class="v" id="d-free">—</span></div>
      <div class="row"><span class="k">Filler folder</span><span class="v" id="d-dir">—</span></div>
      <div class="row"><span class="k">Existing filler</span><span class="v" id="d-filler">—</span></div>

      <div class="callout hidden" id="updatewarn">
        <div class="note" id="updatetext"></div>
        <ul class="names" id="updatelist"></ul>
        <div class="buttons"><button id="delupdates">Delete staged update</button></div>
      </div>

      <div class="callout hidden" id="elsewhere">
        <div class="note" id="elsewheretext"></div>
        <div class="buttons"><button id="useelsewhere">Use that folder</button></div>
      </div>

      <div class="callout callout--warn hidden" id="foreignwarn">
        <div class="note" id="foreigntext"></div>
        <ul class="names" id="foreignlist"></ul>
        <label class="ack"><input type="checkbox" id="overwrite" /> <span id="overwritelabel"></span></label>
      </div>

      <div id="dirbox" class="hidden" style="margin-top:12px">
        <label for="dirname">Folder name, at the storage root — press Enter to use it</label>
        <input type="text" id="dirname" value="fill_disk" spellcheck="false" autocapitalize="off"
               autocomplete="off" enterkeyhint="done" />
        <div class="note warn hidden" id="dirwarn" role="alert"></div>
      </div>
    </div>
    <div class="buttons">
      <button id="refresh">Refresh</button>
      <button id="rename" aria-expanded="false" aria-controls="dirbox">Change folder…</button>
    </div>
  </section>

  <section class="block">
    <div class="targets">
      <div><label for="low">Leave at least (MB)</label><input type="number" id="low" value="50" min="1" step="1" /></div>
      <div><label for="high">…and at most (MB)</label><input type="number" id="high" value="90" min="2" step="1" /></div>
    </div>
    <div class="note strong" id="estimate">—</div>
    <div class="note warn hidden" id="rangewarn" role="alert"></div>
    <div class="buttons">
      <button class="primary" id="fill" disabled>Fill</button>
      <button id="stop" disabled>Stop</button>
      <button id="clean" disabled>Remove Fill Folder &amp; Fill Content</button>
    </div>
  </section>

  <section class="block grow">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
      <i id="barfill"></i>
    </div>
    <div class="meta"><span id="p-left">Idle</span><span id="p-right"></span></div>
    <div id="log" role="log" aria-live="polite"></div>
  </section>

<script type="module">
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const MB = 1024 * 1024;
const $ = (id) => document.getElementById(id);
let device = null, busy = false;
// Guarded rather than merely debounced. Disabling the buttons stops a *click* landing
// mid-detect, but the folder-name field re-detects on its own timer, and a detect takes
// longer than the debounce — so two could overlap and the second open would fail for
// exclusive access. A detect requested during one is folded into a single re-run after.
let detecting = false, detectAgain = false;
// Only shapes the pre-flight estimate. Seeded from a Paperwhite Signature Edition and
// replaced by this device's own measured throughput once a transfer reports one — so
// the second estimate you see is about your Kindle and cable, not someone else's.
//
// Worth feeding back only because the reported rate is bytes-over-elapsed-time. An
// average of instantaneous samples reads high on bursty MTP traffic, and learning from
// that would have made every estimate progressively more optimistic.
let observedRate = 25.5 * MB;

function log(line) {
  const el = $('log');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 20;
  el.textContent += (el.textContent ? '\n' : '') + line;
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function readWindow() {
  return { low: Math.round(Number($('low').value) * MB), high: Math.round(Number($('high').value) * MB) };
}

const DEFAULT_DIR = 'fill_disk';
function dirName() {
  return $('dirname').value.trim() || DEFAULT_DIR;
}

/// True when the folder holds content this tool didn't write and overwriting hasn't
/// been confirmed.
///
/// A folder holding only our own filler is deliberately not this case — that's a
/// resume, and there is nothing there to lose. Warning about data loss when the data
/// is our own filler would be false, and it would put a confirmation in front of the
/// ordinary stop-and-continue path.
function blockedByForeign() {
  return !!(device && device.foreign.length && !$('overwrite').checked);
}

/// Mirrors Window::MIN_WIDTH in plan.rs. Checked here purely so the problem is visible
/// before you press Fill; the backend rejects it regardless.
const MIN_WIDTH = 4 * MB;

function validate() {
  const { low, high } = readWindow();
  const warn = $('rangewarn');
  let msg = '';
  if (!(low > 0) || !(high > 0)) msg = 'Enter both bounds.';
  else if (low >= high) msg = 'The lower bound must be below the upper bound.';
  else if (high - low < MIN_WIDTH) msg = 'That range is too narrow to hit reliably — leave at least 4 MB between them.';
  warn.textContent = msg;
  warn.classList.toggle('hidden', !msg);
  return !msg;
}

function estimate() {
  if (!device || !validate()) { $('estimate').textContent = '—'; return; }
  const { low, high } = readWindow();
  const aim = low + (high - low) / 2;
  if (device.free >= low && device.free <= high) {
    $('estimate').textContent = 'Already inside the target window — nothing to do.';
    return;
  }
  // Below the window, Fill goes the other way: it removes filler to free space, then
  // writes smaller objects back down into the window. Worth saying, because a button
  // called Fill that starts deleting is otherwise a surprise.
  if (device.free < low) {
    const toFree = ((low + high) / 2 - device.free) / MB;
    $('estimate').textContent =
      `${toFree.toFixed(0)} MB below the target — Fill will remove filler to free space, ` +
      `then top back up. Takes seconds.`;
    return;
  }
  const toWrite = Math.max(0, device.free - aim);
  const secs = toWrite / observedRate;
  const mins = Math.round(secs / 60);
  const gb = (toWrite / (1024 * 1024 * 1024)).toFixed(2);
  $('estimate').textContent =
    `About ${gb} GB to write — roughly ${mins < 1 ? 'under a minute' : mins + ' min'} at ~${(observedRate / MB).toFixed(0)} MB/s.`;
}

/// The one place that decides what is clickable.
///
/// Five sites used to answer this question — setBusy, renderDevice, the Overwrite
/// handler, refresh and showNoDevice — and three of them had never heard of `busy`.
/// That is how Fill became clickable *during* a fill: reticking Overwrite ran a
/// recomputation that only knew about the device, and the second click opened the
/// device a second time while the first operation still held it, which strands the
/// first with no reachable Stop. Every transition calls this, and nothing else in this
/// module assigns `.disabled`.
function updateControls() {
  const usable = !!device && device.writable;
  // A detect holds the device exactly as an operation does, so it locks the same set.
  const locked = busy || detecting;

  $('fill').disabled = locked || !usable || blockedByForeign();
  $('clean').disabled = locked || !device || device.filler_files === 0;
  $('refresh').disabled = locked;
  // `busy` alone, and it does not latch off when pressed. The backend publishes the
  // cancel token only once the device is open, so a Stop landing in the second or two
  // before that has nothing to pull on — greying the button there would leave the
  // transfer running with its only exit already spent. Pressing again works; the log
  // line is the acknowledgement.
  $('stop').disabled = !busy;
  $('low').disabled = locked;
  $('high').disabled = locked;
  // The folder name selects what the running operation is writing into; changing it
  // mid-fill would leave the UI describing a folder the engine isn't using. The same
  // goes for the button that adopts a folder found under another name.
  $('dirname').disabled = locked;
  $('rename').disabled = locked;
  $('useelsewhere').disabled = locked;
  $('delupdates').disabled = locked || !device || device.updates.length === 0;
  $('overwrite').disabled = locked;
}

function setBusy(on) {
  busy = on;
  updateControls();
}

function fillList(el, items) {
  el.textContent = '';
  for (const it of items) {
    const li = document.createElement('li');
    li.textContent = `${it.name} (${it.human})`;
    el.appendChild(li);
  }
}

/// The three rows that change while an operation runs. One formatter, two callers —
/// the full snapshot from `detect` and the live deltas that arrive during a fill —
/// so the header can't say one thing before a fill and something differently-worded
/// during it.
function paintLiveRows(d) {
  $('d-free').textContent = d.free_human;
  // Named, not just counted: undoing this by hand means knowing what to look for.
  $('d-dir').textContent = d.fill_dir + (d.fill_dir_exists ? '' : ' (not present yet)');
  $('d-filler').textContent = d.filler_files
    ? `${d.filler_files} file${d.filler_files === 1 ? '' : 's'}, ${d.filler_human}`
    : 'none';
}

/// Apply one engine event's worth of change, so the panel tracks a running fill
/// instead of freezing at whatever `detect` last saw. `detect` can't be called
/// meanwhile: it opens the device, and the fill is holding it.
function applyDeviceUpdate(u) {
  if (!device) return;
  if (u.free_human) { device.free = u.free; device.free_human = u.free_human; }
  if (u.files_delta || u.bytes_delta) {
    device.filler_files = Math.max(0, device.filler_files + u.files_delta);
    device.filler_bytes = Math.max(0, device.filler_bytes + u.bytes_delta);
    device.filler_human = humanBytes(device.filler_bytes);
    // The first object written is also the moment the folder starts existing.
    if (device.filler_files > 0) device.fill_dir_exists = true;
  }
  paintLiveRows(device);
}

/// Mirrors human_bytes in lib.rs. Duplicated deliberately and narrowly: the values
/// updated here never make the IPC round trip that would let Rust format them.
function humanBytes(bytes) {
  const units = [['GB', 1024 ** 3], ['MB', 1024 ** 2], ['KB', 1024]];
  for (const [suffix, scale] of units) {
    if (bytes >= scale) return `${(bytes / scale).toFixed(2)} ${suffix}`;
  }
  return `${bytes} B`;
}

function renderDevice(d) {
  device = d;
  $('dot').className = 'dot ' + (d.writable ? 'ok' : 'bad');
  $('devline').textContent = d.writable ? 'Kindle connected' : 'Kindle connected (storage is read-only)';
  $('devinfo').classList.remove('hidden');
  $('d-storage').textContent = d.storage;
  $('d-total').textContent = d.total_human;
  paintLiveRows(d);

  // Filler under another name. The app forgets the folder between launches, so
  // without this a relaunch reports an empty default while gigabytes sit elsewhere —
  // and Remove, aimed at the default, would delete nothing and say it worked.
  const stray = d.elsewhere && d.elsewhere.length ? d.elsewhere[0] : null;
  $('elsewhere').classList.toggle('hidden', !stray);
  if (stray) {
    $('elsewhere').dataset.name = stray.name;
    $('elsewheretext').textContent =
      `${d.fill_dir} is empty, but ${stray.files} filler file${stray.files === 1 ? '' : 's'} ` +
      `(${stray.human}) are in ${stray.name}. Remove only works on the folder shown above.`;
  }

  const foreign = d.foreign.length > 0;
  $('foreignwarn').classList.toggle('hidden', !foreign);
  if (foreign) {
    const n = d.foreign.length;
    $('foreigntext').textContent =
      `${d.fill_dir} already exists and holds ${n} item${n === 1 ? '' : 's'} this tool ` +
      `didn't write. Use a different folder name, or overwrite it:`;
    $('overwritelabel').textContent =
      `Overwrite ${d.fill_dir} — permanently deletes everything in it, listed above`;
    fillList($('foreignlist'), d.foreign);
    // A fresh listing is a fresh decision: never carry a tick across a re-detect, or a
    // confirmation given for one folder's contents would apply to another's.
    $('overwrite').checked = false;
  } else {
    $('overwrite').checked = false;
  }

  // Stated, not editorialized: it's the user's device and possibly their own file.
  const staged = d.updates.length > 0;
  $('updatewarn').classList.toggle('hidden', !staged);
  disarmDelete();
  if (staged) {
    $('updatetext').textContent = staged && d.updates.length === 1
      ? 'A downloaded firmware update is on the device:'
      : 'Downloaded firmware updates are on the device:';
    fillList($('updatelist'), d.updates);
  }

  updateControls();
  estimate();
}

/// One painter for "there is no usable device", so the unplug watcher and a failed
/// detect can't drift into describing the same state two different ways.
function showNoDevice(line) {
  device = null;
  $('dot').className = 'dot bad';
  $('devline').textContent = line;
  $('devinfo').classList.add('hidden');
  $('updatewarn').classList.add('hidden');
  $('elsewhere').classList.add('hidden');
  updateControls();
}

async function refresh() {
  if (detecting) { detectAgain = true; return; }
  detecting = true;
  // Synchronously, before the first await. Fill and the remove button open the device
  // themselves, so they must not be live while a detect holds it — and a click landing
  // in the gap before an await resumes is a click on a device that is already busy.
  updateControls();
  try {
    renderDevice(await invoke('detect', { dirName: dirName() }));
  } catch (e) {
    showNoDevice('No Kindle found');
    log(String(e));
  } finally {
    detecting = false;
    updateControls();
    if (detectAgain) { detectAgain = false; refresh(); }
  }
}

listen('kindlefill://log', (e) => log(e.payload.line));

listen('kindlefill://device', (e) => applyDeviceUpdate(e.payload));

listen('kindlefill://progress', (e) => {
  const p = e.payload;
  $('barfill').style.width = (p.fraction * 100).toFixed(1) + '%';
  $('bar').setAttribute('aria-valuenow', p.percent.toFixed(0));
  if (p.rate > 0) observedRate = p.rate;
  $('p-left').textContent = `${p.percent.toFixed(1)}% — ${p.done_human} of ${p.total_human}`;
  $('p-right').textContent = `${p.rate_human} · ${p.eta_human} left`;
});

$('refresh').onclick = refresh;
for (const id of ['low', 'high']) $(id).oninput = estimate;

/// Mirrors validate_dir_name in engine.rs. Checked here so a bad name says so in
/// place, rather than travelling to the backend and coming back as a failed detect —
/// which the catch would have rendered as "No Kindle found", blaming the cable for a
/// typo.
function dirNameError(name) {
  if (!name) return 'Enter a folder name.';
  if (name !== name.trim()) return 'No leading or trailing spaces.';
  if (/^\.+$/.test(name)) return 'That name is just dots.';
  // eslint-disable-next-line no-control-regex
  if (/[\u0000-\u001f/\\:*?"<>|]/.test(name)) return 'Use letters, digits, spaces, dot, dash or underscore.';
  return '';
}

function setDirBox(shown) {
  $('dirbox').classList.toggle('hidden', !shown);
  $('rename').setAttribute('aria-expanded', String(shown));
  $('rename').textContent = shown ? 'Done' : 'Change folder…';
  if (shown) $('dirname').focus();
}

/// Commit the typed name: re-read the device against it, because which folder we are
/// looking at decides existing filler, foreign content, and whether Fill is safe.
let appliedDir = DEFAULT_DIR;
async function applyDirName() {
  clearTimeout(dirDebounce);
  const name = $('dirname').value;
  const err = dirNameError(name);
  $('dirwarn').textContent = err;
  $('dirwarn').classList.toggle('hidden', !err);
  if (err || busy || name === appliedDir) return;
  appliedDir = name;
  await refresh();
}

$('useelsewhere').onclick = async () => {
  const name = $('elsewhere').dataset.name;
  if (!name) return;
  $('dirname').value = name;
  await applyDirName();
};

$('rename').onclick = async () => {
  const opening = $('dirbox').classList.contains('hidden');
  if (!opening) await applyDirName();
  setDirBox(opening);
};

$('dirname').onkeydown = async (e) => {
  if (e.key === 'Enter') { e.preventDefault(); await applyDirName(); if (!dirNameError($('dirname').value)) setDirBox(false); }
  if (e.key === 'Escape') { e.preventDefault(); $('dirname').value = appliedDir; $('dirwarn').classList.add('hidden'); setDirBox(false); }
};

// Committing on blur too, so clicking away isn't a silent way to lose the edit.
$('dirname').onblur = () => { applyDirName(); };

// A slow fallback for anyone who types and waits rather than pressing Enter.
let dirDebounce;
$('dirname').oninput = () => {
  clearTimeout(dirDebounce);
  dirDebounce = setTimeout(applyDirName, 900);
};

$('overwrite').onchange = updateControls;

// Two clicks rather than a native confirm(). A webview's dialog support is the host's
// business, not ours, and a confirm() that silently returns falsy would leave this
// button doing nothing at all — a dead feature that looks alive. This is in our own
// DOM, so it works wherever the app does. The filenames are already listed above the
// button, so the second click is confirming something visible.
let armedDelete = false;
function disarmDelete() {
  armedDelete = false;
  $('delupdates').textContent = 'Delete staged update';
  $('delupdates').classList.remove('danger');
}

$('delupdates').onclick = async () => {
  const names = device ? device.updates.map((u) => u.name) : [];
  if (!names.length) return;
  if (!armedDelete) {
    armedDelete = true;
    $('delupdates').textContent = 'Click again to delete permanently';
    $('delupdates').classList.add('danger');
    setTimeout(() => { if (armedDelete) disarmDelete(); }, 8000);
    return;
  }
  disarmDelete();
  setBusy(true);
  try {
    log(await invoke('delete_updates', { names }));
  } catch (e) {
    log('Error: ' + String(e));
  } finally {
    setBusy(false);
    await refresh();
  }
};

$('fill').onclick = async () => {
  if (!validate() || blockedByForeign()) return;
  const { low, high } = readWindow();
  setBusy(true);
  $('barfill').style.width = '0%';
  $('bar').setAttribute('aria-valuenow', '0');
  try {
    log(await invoke('start_fill', {
      low, high, dirName: dirName(), overwrite: $('overwrite').checked,
    }));
  } catch (e) {
    log('Error: ' + String(e));
  } finally {
    setBusy(false);
    await refresh();
  }
};

$('stop').onclick = async () => {
  log('Stopping…');
  await invoke('cancel_fill');
};

$('clean').onclick = async () => {
  setBusy(true);
  try {
    log(await invoke('start_clean', { dirName: dirName() }));
  } catch (e) {
    log('Error: ' + String(e));
  } finally {
    setBusy(false);
    $('barfill').style.width = '0%';
    $('p-left').textContent = 'Idle'; $('p-right').textContent = '';
    await refresh();
  }
};

/// Watch the cable. `detect` opens the device, so it is far too heavy to run on a
/// timer and outright impossible while a fill holds it; `device_present` only
/// enumerates USB. Without this the header sat on "Kindle connected" indefinitely
/// after an unplug, because nothing repainted it until the next manual Refresh.
///
/// Skipped while busy: an operation in flight surfaces a disconnect as its own error
/// within a second or two, and that path has the better message.
const PRESENCE_POLL_MS = 2000;
setInterval(async () => {
  if (busy || detecting) return;
  let present;
  try {
    present = await invoke('device_present');
  } catch {
    return; // transient IPC failure is not evidence the cable came out
  }
  if (present === !!device) return;
  if (present) {
    log('Kindle reconnected.');
    await refresh();
  } else {
    showNoDevice('Kindle unplugged');
    log('Kindle unplugged.');
  }
}, PRESENCE_POLL_MS);

refresh();
</script>
</body>
</html>
