name: Release

# Tag-driven, so the artifact people download is built from a commit CI has already
# passed rather than from whatever was on a laptop that afternoon.
#
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # Apple silicon runner, which is what the DMG is built for. There is no Intel build
    # because there is no Intel Mac to test one on — see the README's Platforms section.
    runs-on: macos-latest
    env:
      # Lifted to job-level env because the `secrets` context is not available inside a
      # step-level `if:`. Referencing it there is not a runtime error — it fails the
      # whole file's validation, so no job runs at all and the failure shows up as the
      # filename rather than the workflow name.
      ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The same three gates CI runs. A tag should not be able to ship something that
      # would have failed a pull request.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Tauri wants a *path* to the App Store Connect key, and a hosted runner has no
      # such file — so if the key is provided as a secret, write it out and hand over
      # the path. Skipped entirely when the Apple ID method is being used instead.
      - name: Materialize the App Store Connect key
        if: env.ASC_KEY_P8 != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      # Signed with the Syrinx Ventures Developer ID and sent to Apple's notary service,
      # so a downloaded build opens on a double-click instead of sending people into
      # System Settings. Tauri reads all five of these from the environment: given
      # APPLE_CERTIFICATE it imports the .p12 into a temporary keychain, signs with the
      # hardened runtime, then notarizes and staples.
      #
      # If the secrets are absent — a fork, or a dry run — this still produces a working
      # ad-hoc signed DMG. It just needs the Privacy & Security dance to open, which is
      # what the release notes below describe when `signed` is false.
      - name: Build the app bundle and DMG
        working-directory: crates/kindlefill-app
        env:
          # Signing. The certificate must be a *Developer ID Application* one — an
          # "Apple Distribution" cert signs for the App Store and cannot notarize for
          # distribution outside it.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization, either way round — Tauri takes an App Store Connect API key or
          # an Apple ID with an app-specific password. The API key is the better one to
          # use if the team already has one: it is revocable on its own, and it isn't a
          # password to a human's account.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_KEY_PATH is set by the step above when a key secret is present.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build

      # `bundle_dmg.sh` sets the window size, background and icon positions by driving
      # Finder over AppleScript, and a CI runner has no Finder session — so it skips all
      # of it and ships a DMG carrying the background image and volume icon but nothing
      # telling Finder to use them. It opens as a plain file list.
      #
      # `.DS_Store` is that missing instruction, captured from a local build where
      # Finder does exist. Safe to inject after notarization: the ticket is stapled to
      # the .app inside, and this only rewrites the container around it.
      - name: Give the DMG its Finder layout
        run: |
          DMG=$(ls target/release/bundle/dmg/*.dmg)
          hdiutil convert "$DMG" -format UDRW -o /tmp/rw.dmg
          MP=$(hdiutil attach /tmp/rw.dmg -nobrowse -noverify | grep -o '/Volumes/.*' | head -1)
          cp crates/kindlefill-app/dmg/DS_Store "$MP/.DS_Store"
          # The volume only draws .VolumeIcon.icns when flagged as having a custom icon.
          SetFile -a C "$MP" 2>/dev/null || true
          hdiutil detach "$MP" -quiet
          rm -f "$DMG"
          hdiutil convert /tmp/rw.dmg -format UDZO -imagekey zlib-level=9 -o "$DMG"
          rm -f /tmp/rw.dmg
          echo "Injected layout into $(basename "$DMG")"

      # Proves the injection worked rather than assuming it — a missing .DS_Store means
      # the DMG opens as a plain list again, which is the defect this step exists for.
      - name: Verify the layout survived
        run: |
          DMG=$(ls target/release/bundle/dmg/*.dmg)
          MP=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          for f in .DS_Store .VolumeIcon.icns .background/background.png; do
            if [ -e "$MP/$f" ]; then echo "  present: $f"; else echo "::error::missing $f"; hdiutil detach "$MP" -quiet; exit 1; fi
          done
          hdiutil detach "$MP" -quiet

      # Asked of the artifact rather than assumed from the secrets being set: signing can
      # succeed and notarization still fail, and a release that claims to open cleanly
      # when it doesn't is worse than one that admits it.
      - name: Check whether the bundle really is notarized
        id: gate
        run: |
          APP=target/release/bundle/macos/KindleFill.app
          if spctl --assess --type execute --verbose=4 "$APP" 2>&1 | grep -q "accepted"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Gatekeeper accepts the bundle."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bundle is not notarized; release notes will say so."
          fi
          codesign -dv --verbose=4 "$APP" 2>&1 | sed -n '1,8p' || true

      # Draft, not published: the release goes live only when a person has read the
      # notes and pressed Publish on GitHub. The generated notes are a starting point
      # to edit there, never the final word.
      - name: Draft the release (notarized)
        if: steps.gate.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/release/bundle/dmg/*.dmg
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — download the `.dmg`, open it, and drag KindleFill to
            Applications. **Apple silicon only.** Signed and notarized by Syrinx
            Ventures, so it opens on a double-click.

            **Windows** — download the `_x64-setup.exe` and run it. The installer is
            **unsigned**, so SmartScreen will warn on first run: click **More info** →
            **Run anyway**. On a machine without the WebView2 runtime the installer
            downloads it, so that first install needs a network connection.

            ---

            *Not created or endorsed by Amazon. Kindle and Amazon are trademarks of
            Amazon.com, Inc. or its affiliates.*

      - name: Draft the release (unnotarized fallback)
        if: steps.gate.outputs.signed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/release/bundle/dmg/*.dmg
          generate_release_notes: true
          body: |
            ## Install

            **Windows** — download the `_x64-setup.exe` and run it. The installer is
            **unsigned**, so SmartScreen will warn on first run: click **More info** →
            **Run anyway**. On a machine without the WebView2 runtime the installer
            downloads it, so that first install needs a network connection.

            ## Install (macOS)

            Download the `.dmg` below, open it, and drag KindleFill to Applications.
            **Apple silicon only.**

            This build is **not notarized**, so macOS quarantines it on download. Since
            macOS Sequoia, right-click → Open no longer works for unnotarized apps. What
            does:

            1. Double-click KindleFill. macOS refuses. Click **Done** — not *Move to Trash*.
            2. **System Settings → Privacy & Security**, scroll to the bottom, click
               **Open Anyway**.
            3. Confirm with your password.

            That button only appears for about an hour after a blocked launch. Or from a
            terminal: `xattr -d com.apple.quarantine /Applications/KindleFill.app`.
            Building from source avoids all of this — a local build is never quarantined.

            ---

            *Not created or endorsed by Amazon. Kindle and Amazon are trademarks of
            Amazon.com, Inc. or its affiliates.*

  installer:
    # Windows is the platform 1.0.1 was validated on, and until this job existed a tag
    # published a macOS-only release — nothing to download for the platform the release
    # notes described. The DMG job is where the draft and its notes come from, so this
    # only adds a file to it.
    #
    # `needs: dmg` couples the two deliberately. Running them in parallel would have both
    # racing to create the same draft, and a half-published release is worse than a late
    # one: the coupling means either both artifacts arrive or neither does, rather than
    # Windows users finding a release whose macOS half silently failed.
    needs: dmg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Run again here rather than trusting the macOS job's pass. These are not the same
      # gates on a different machine — `clippy` and the test suite compile the
      # `cfg(windows)` code that no other runner touches, which is where the WPD device
      # probe, the drive-letter volume search and the Windows error wording live. This
      # repo has already shipped a Windows test suite that had never once run.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Produces target/release/bundle/nsis/KindleFill_<version>_x64-setup.exe. The
      # version comes from the workspace Cargo.toml — `tauri.conf.json` deliberately
      # declares none — so this filename and the DMG's cannot disagree about the release
      # they belong to.
      - name: Build the NSIS installer
        working-directory: crates/kindlefill-app
        run: cargo tauri build

      # The bundler is the only thing that knows the exact filename, so check one landed
      # rather than discovering an empty upload in the draft.
      - name: Verify the installer exists
        shell: bash
        run: |
          ls -l target/release/bundle/nsis/*_x64-setup.exe

      # Same tag, so this attaches to the draft the DMG job created. No `body` and no
      # `generate_release_notes` here on purpose: passing either would overwrite the
      # notes that job wrote, and the Windows instructions are already in them.
      - name: Add the installer to the draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/release/bundle/nsis/*_x64-setup.exe
