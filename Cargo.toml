[workspace]
members = ["crates/kindlefill-core", "crates/kindlefill-cli", "crates/kindlefill-app"]
resolver = "2"

[workspace.package]
# The single place a version is declared. `tauri.conf.json` deliberately does not carry
# one — Tauri falls back to this when the key is absent — so the .app, the .dmg, the NSIS
# installer, both binaries and the version shown in the window cannot disagree about
# what they are. Two declarations is one more than can be kept in step by hand, and the
# failure is silent: a macOS build and a Windows build of the same commit calling
# themselves different versions.
version = "1.0.0"
edition = "2021"
# Matches mtp-rs and the Rust ecosystem default. Apache-2.0 carries the explicit
# patent grant; MIT is the shorter, more universally recognized option. Downstream
# users take whichever their situation calls for.
license = "MIT OR Apache-2.0"
repository = "https://github.com/SyrinxVentures/kindlefill"

[workspace.dependencies]
mtp-rs = "0.30"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
anyhow = "1"
libc = "0.2"
