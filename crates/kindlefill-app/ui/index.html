<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>KindleFill</title>
<style>
  :root {
    --bg: #f6f6f7; --panel: #fff; --ink: #16171a; --muted: #6b7078;
    --line: #dfe1e5; --accent: #2f6feb; --ok: #1a7f4b; --warn: #9a5b00; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --panel: #202226; --ink: #e9eaec; --muted: #9aa0a8;
      --line: #33363c; --accent: #6a9bff; --ok: #4ec98a; --warn: #e0a458; --bad: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  /* The window never scrolls. Everything above the log is fixed-height, so the log
     takes the remainder — which keeps the layout exact at the default size and
     still correct when the window is resized or a warning appears and pushes
     everything down. A fixed log height can only be right at one window size, and it
     wasn't right at this one.

     `overflow-y: auto` rather than `hidden`: normally the log soaks up the slack and
     no scrollbar appears at all, but when the conflict and firmware banners are both
     showing there is genuinely more content than fits, and scrolling to it beats
     silently clipping it. */
  html, body { height: 100%; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  h1 { font-size: 17px; margin: 0 0 14px; flex: none; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 14px; flex: none;
  }
  /* `min-height: 0` is load-bearing: without it a flex item refuses to shrink below
     its content, and the log's own scroll area would push the page tall again. */
  .card.grow { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; margin-bottom: 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .row .k { color: var(--muted); }
  .row .v { font-variant-numeric: tabular-nums; }
  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  label { color: var(--muted); display: block; margin-bottom: 4px; }
  .targets { display: flex; gap: 10px; align-items: flex-end; }
  .targets > div { flex: 1; }
  input[type=number], input[type=text] {
    width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums;
  }
  .ack { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: inherit; }
  .ack input { margin: 0; }
  .names {
    margin: 4px 0 0; padding-left: 18px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
  }
  .buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .bar {
    height: 10px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden; margin: 4px 0 8px;
  }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
  #log {
    flex: 1 1 auto; min-height: 60px;
    overflow-y: auto; background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; white-space: pre-wrap; word-break: break-word;
  }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .note.warn { color: var(--warn); }
  .note.bad { color: var(--bad); }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>KindleFill</h1>

  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="devline">Looking for a Kindle…</span></div>
    <div id="devinfo" class="hidden">
      <div class="row"><span class="k">Storage</span><span class="v" id="d-storage">—</span></div>
      <div class="row"><span class="k">Capacity</span><span class="v" id="d-total">—</span></div>
      <div class="row"><span class="k">Free now</span><span class="v" id="d-free">—</span></div>
      <div class="row"><span class="k">Filler folder</span><span class="v" id="d-dir">—</span></div>
      <div class="row"><span class="k">Existing filler</span><span class="v" id="d-filler">—</span></div>
      <div id="dirbox" class="hidden" style="margin-top:8px">
        <label for="dirname">Folder name, at the storage root</label>
        <input type="text" id="dirname" value="fill_disk" spellcheck="false" autocapitalize="off" />
      </div>
      <div class="note warn hidden" id="foreignwarn">
        <div id="foreigntext"></div>
        <ul class="names" id="foreignlist"></ul>
        <label class="ack"><input type="checkbox" id="foreignack" /> Use this folder anyway</label>
      </div>
      <div class="note bad hidden" id="updatewarn">
        <div id="updatetext"></div>
        <ul class="names" id="updatelist"></ul>
      </div>
    </div>
    <div class="buttons">
      <button id="refresh">Refresh</button>
      <button id="rename">Change folder…</button>
      <button id="delupdates" class="hidden">Delete staged update</button>
    </div>
  </div>

  <div class="card">
    <div class="targets">
      <div><label for="low">Leave at least (MB)</label><input type="number" id="low" value="50" min="1" step="1" /></div>
      <div><label for="high">…and at most (MB)</label><input type="number" id="high" value="90" min="2" step="1" /></div>
    </div>
    <div class="note" id="estimate">—</div>
    <div class="note warn hidden" id="rangewarn"></div>
    <div class="buttons">
      <button class="primary" id="fill" disabled>Fill</button>
      <button id="stop" disabled>Stop</button>
      <button id="clean" disabled>Remove Filler</button>
    </div>
  </div>

  <div class="card grow">
    <div class="bar"><i id="barfill"></i></div>
    <div class="meta"><span id="p-left">Idle</span><span id="p-right"></span></div>
    <div id="log" style="margin-top:10px"></div>
  </div>

<script type="module">
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const MB = 1024 * 1024;
const $ = (id) => document.getElementById(id);
let device = null, busy = false;
// Seeded from the measured throughput of a Paperwhite Signature Edition. Replaced by
// the live rate as soon as the transfer reports one, so it only ever shapes the
// pre-flight estimate.
let observedRate = 25.5 * MB;

function log(line) {
  const el = $('log');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 20;
  el.textContent += (el.textContent ? '\n' : '') + line;
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function readWindow() {
  return { low: Math.round(Number($('low').value) * MB), high: Math.round(Number($('high').value) * MB) };
}

const DEFAULT_DIR = 'fill_disk';
function dirName() {
  return $('dirname').value.trim() || DEFAULT_DIR;
}

/// True when the folder holds something this tool didn't write and the user hasn't
/// said to use it anyway. `clean` never touches those files — but a folder full of
/// someone else's content is a sign we're about to move into the wrong room.
function blockedByForeign() {
  return !!(device && device.foreign.length && !$('foreignack').checked);
}

/// Mirrors Window::MIN_WIDTH in plan.rs. Checked here purely so the problem is visible
/// before you press Fill; the backend rejects it regardless.
const MIN_WIDTH = 4 * MB;

function validate() {
  const { low, high } = readWindow();
  const warn = $('rangewarn');
  let msg = '';
  if (!(low > 0) || !(high > 0)) msg = 'Enter both bounds.';
  else if (low >= high) msg = 'The lower bound must be below the upper bound.';
  else if (high - low < MIN_WIDTH) msg = 'That range is too narrow to hit reliably — leave at least 4 MB between them.';
  warn.textContent = msg;
  warn.classList.toggle('hidden', !msg);
  return !msg;
}

function estimate() {
  if (!device || !validate()) { $('estimate').textContent = '—'; return; }
  const { low, high } = readWindow();
  const aim = low + (high - low) / 2;
  const toWrite = Math.max(0, device.free - aim);
  if (toWrite === 0) { $('estimate').textContent = 'Already inside the target window — nothing to write.'; return; }
  const secs = toWrite / observedRate;
  const mins = Math.round(secs / 60);
  const gb = (toWrite / (1024 * 1024 * 1024)).toFixed(2);
  $('estimate').textContent =
    `About ${gb} GB to write — roughly ${mins < 1 ? 'under a minute' : mins + ' min'} at ~${(observedRate / MB).toFixed(0)} MB/s.`;
}

function setBusy(on) {
  busy = on;
  $('fill').disabled = on || !device || blockedByForeign();
  $('clean').disabled = on || !device;
  $('refresh').disabled = on;
  $('stop').disabled = !on;
  $('low').disabled = on; $('high').disabled = on;
  // The folder name selects what the running operation is writing into; changing it
  // mid-fill would leave the UI describing a folder the engine isn't using.
  $('dirname').disabled = on; $('rename').disabled = on;
  $('delupdates').disabled = on;
}

function fillList(el, items) {
  el.textContent = '';
  for (const it of items) {
    const li = document.createElement('li');
    li.textContent = `${it.name} (${it.human})`;
    el.appendChild(li);
  }
}

function renderDevice(d) {
  device = d;
  $('dot').className = 'dot ' + (d.writable ? 'ok' : 'bad');
  $('devline').textContent = d.writable ? 'Kindle connected' : 'Kindle connected (storage is read-only)';
  $('devinfo').classList.remove('hidden');
  $('d-storage').textContent = d.storage;
  $('d-total').textContent = d.total_human;
  $('d-free').textContent = d.free_human;
  // Named, not just counted: undoing this by hand means knowing what to look for.
  $('d-dir').textContent = d.fill_dir + (d.fill_dir_exists ? '' : ' (not present yet)');
  $('d-filler').textContent = d.filler_files
    ? `${d.filler_files} file${d.filler_files === 1 ? '' : 's'}, ${d.filler_human}`
    : 'none';

  const foreign = d.foreign.length > 0;
  $('foreignwarn').classList.toggle('hidden', !foreign);
  if (foreign) {
    $('foreigntext').textContent =
      `${d.fill_dir} holds ${d.foreign.length} item${d.foreign.length === 1 ? '' : 's'} ` +
      `this tool didn't write. ${d.foreign.length === 1 ? 'It' : 'They'} and the folder will be ` +
      `left in place. Use a different name, or confirm:`;
    fillList($('foreignlist'), d.foreign);
    // A fresh listing is a fresh decision; don't carry an old acknowledgement over.
    $('foreignack').checked = false;
  }

  // Filling around an update that's already downloaded accomplishes nothing — the
  // bytes are on the device and it will install them at the next restart.
  const staged = d.updates.length > 0;
  $('updatewarn').classList.toggle('hidden', !staged);
  $('delupdates').classList.toggle('hidden', !staged);
  if (staged) {
    $('updatetext').textContent =
      `A firmware update is already downloaded. Filling around it accomplishes nothing — ` +
      `the Kindle will install it at the next restart. Delete it first:`;
    fillList($('updatelist'), d.updates);
  }

  $('fill').disabled = !d.writable || blockedByForeign();
  $('clean').disabled = d.filler_files === 0;
  estimate();
}

async function refresh() {
  // Fill and Remove Filler open the device themselves. Leaving them live while a
  // detect is in flight lets a fast click land during it, and the second open fails
  // for exclusive access — a confusing error for what looks like an idle app.
  $('refresh').disabled = true;
  $('fill').disabled = true;
  $('clean').disabled = true;
  try {
    renderDevice(await invoke('detect', { dirName: dirName() }));
  } catch (e) {
    device = null;
    $('dot').className = 'dot bad';
    $('devline').textContent = 'No Kindle found';
    $('devinfo').classList.add('hidden');
    $('delupdates').classList.add('hidden');
    $('fill').disabled = true; $('clean').disabled = true;
    log(String(e));
  } finally {
    $('refresh').disabled = busy;
  }
}

listen('kindlefill://log', (e) => log(e.payload.line));

listen('kindlefill://progress', (e) => {
  const p = e.payload;
  $('barfill').style.width = (p.fraction * 100).toFixed(1) + '%';
  $('p-left').textContent = `${p.percent.toFixed(1)}% — ${p.done_human} of ${p.total_human}`;
  $('p-right').textContent = `${p.rate_human} · ${p.eta_human} left`;
});

$('refresh').onclick = refresh;
for (const id of ['low', 'high']) $(id).oninput = estimate;

$('rename').onclick = () => {
  const box = $('dirbox');
  box.classList.toggle('hidden');
  if (!box.classList.contains('hidden')) $('dirname').focus();
};

// Changing the name changes which folder we're looking at, so the whole picture —
// existing filler, foreign content — has to be re-read before Fill means anything.
let dirDebounce;
$('dirname').oninput = () => {
  clearTimeout(dirDebounce);
  dirDebounce = setTimeout(() => { if (!busy) refresh(); }, 400);
};

$('foreignack').onchange = () => {
  $('fill').disabled = !device || !device.writable || blockedByForeign();
};

$('delupdates').onclick = async () => {
  const names = device ? device.updates.map((u) => u.name) : [];
  if (!names.length) return;
  if (!confirm(`Permanently delete from the Kindle:\n\n${names.join('\n')}\n\nThis cannot be undone.`)) return;
  setBusy(true);
  try {
    log(await invoke('delete_updates', { names }));
  } catch (e) {
    log('Error: ' + String(e));
  } finally {
    setBusy(false);
    await refresh();
  }
};

$('fill').onclick = async () => {
  if (!validate() || blockedByForeign()) return;
  const { low, high } = readWindow();
  setBusy(true);
  $('barfill').style.width = '0%';
  try {
    log(await invoke('start_fill', { low, high, dirName: dirName() }));
  } catch (e) {
    log('Error: ' + String(e));
  } finally {
    setBusy(false);
    await refresh();
  }
};

$('stop').onclick = async () => {
  $('stop').disabled = true;
  log('Stopping…');
  await invoke('cancel_fill');
};

$('clean').onclick = async () => {
  setBusy(true);
  try {
    log(await invoke('start_clean', { dirName: dirName() }));
  } catch (e) {
    log('Error: ' + String(e));
  } finally {
    setBusy(false);
    $('barfill').style.width = '0%';
    $('p-left').textContent = 'Idle'; $('p-right').textContent = '';
    await refresh();
  }
};

refresh();
</script>
</body>
</html>
